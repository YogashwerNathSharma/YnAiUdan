<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="YnAiUdan AI Agent Platform" />
    <title>YnAiUdan</title>
    <script>
      // Apply the saved theme + background before React mounts to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("ynaiudan_theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          var bg = localStorage.getItem("ynaiudan_bg");
          if (bg) document.documentElement.style.setProperty("--app-bg", bg);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
